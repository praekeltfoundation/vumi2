[project]
name = "vumi2"
version = "0.3.3-dev"
description = "Vumi, but with Python3 and Trio async"
authors = [
    { name = "Praekelt.org", email = "dev@praekelt.org" },
]
license = { text = "BSD 3-Clause" }
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "trio>=0.24.0",
    "anyio>=4.0.0",
    "async-amqp>=0.5.5",
    "attrs>=23.2.0",
    "cattrs>=23.2.3",
    "PyYAML>=6.0.1",
    "sentry-sdk>=2.8.0,<3.0.0",
    "quart-trio>=0.11.1",
    "hypercorn>=0.16.0",
    "smpp.pdu3>=0.6,<0.7",
    "unidecode>=1.3.8,<2.0.0",
    "prometheus-client>=0.22.1",
    "httpx2>=2.12.0",
]

[project.urls]
Repository = "https://github.com/praekeltfoundation/vumi2"

[project.scripts]
vumi2 = "vumi2.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-trio>=0.8.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.1",
    "ty",
    "types-pyyaml>=6.0.12.12",
]
docs = [
    "sphinx>=7.2.6,<8.0.0",
    "sphinxcontrib-httpdomain>=1.8.1,<2.0.0",
]

[tool.uv]
exclude-newer = "7 days"

[build-system]
requires = ["uv_build>=0.11.16,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["tests/**"]

[tool.pytest.ini_options]
trio_mode = true
addopts = "--cov=src --cov-report=term-missing"
markers = [
    "asyncio: mark test as asyncio"
]

[tool.coverage.report]
exclude_also = ["@overload"]

[tool.ty.environment]
root = ["./src", "./"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
empty-body = "warn"
invalid-argument-type = "warn"
invalid-assignment = "warn"
invalid-context-manager = "warn"
invalid-method-override = "warn"
unresolved-attribute = "warn"
unused-type-ignore-comment = "ignore"

[tool.ty.analysis]
replace-imports-with-any = [
    "async_amqp.**",
    "gsm0338",
    "smpp.**",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W", # pycodestyle + pyflakes == flake8 - mccabe
    "I",           # isort
    "B",           # flake8-bugbear
    "UP",          # pyupgrade
    "S",           # flake8-bandit
    "C4",          # flake8-comprehensions
    "PIE",         # flake8-pie
    "SIM",         # flake8-simplify
    "PTH",         # flake8-use-pathlib
    "PT",          # flake8-pytest-style
    "RUF",         # ruff-specific rules
]
ignore = [
    "SIM117", # Nested `with` is often more readable.
]

[tool.ruff.lint.isort]
known-first-party = ["vumi2"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # It's okay to use `assert` in tests.
]
